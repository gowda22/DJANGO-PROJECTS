
{% extends 'base.html' %}

{% block title %}Submit Feedback | Student Feedback{% endblock %}

{% block content %}

<h2>Submit Your Feedback</h2>

<p>Your suggestions help us improve.</p>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Submit Feedback</button>
</form>

<p>
    <a href="{% url 'dashboard' %}">Back to Dashboard</a>
</p>

{% endblock %}
