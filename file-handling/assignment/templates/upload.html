<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Assignment</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'assignment/style.css' %}">
</head>
<body>
    <main class="container">
        <h2>Upload Assignment</h2>
        <p class="help-text">Enter your details and choose the assignment file.</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Upload</button>
        </form>

        <p><a href="{% url 'list' %}">View uploaded assignments</a></p>
    </main>
</body>
</html>
