{%extends 'base.html'%}
{% block content%}

<a href="{% url 'student-create%}" class="btn btn-success mb3"> add student</a>

<table class="table table-bordered  table-striped">
    <tr>
        <th>name</th>
        <th>age</th>
        <th>course </th>
        <th>actions</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{student.name}}</td>
        <td>{{student.age}}</td>
        <td>{{student.course}}</td>
        <td>
            <a href="{%url 'student-detail' student.pk%}" class="btn btn-info btn-sm"> view</a>
            
            <a href="{%url 'student-update' student.pk%}" class="btn btn-warning btn-sm"> edit</a>
            <a href="{%url 'student-detail' student.pk%}" class="btn btn-info btn-sm"> delete</a>

        </td>
    </tr>

    {% empty %}

    <tr>
        <td  colspan="4" class="text-center"> no student found</td>
      
    </tr>
     {% endfor% }
</table>
{% endblock%}
