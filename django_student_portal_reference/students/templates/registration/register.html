{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Create a student account</h1>
<p>Username and password are for login. The remaining fields create your student profile.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
</form>
<p>Already registered? <a href="{% url 'login' %}">Login</a>.</p>
{% endblock %}
