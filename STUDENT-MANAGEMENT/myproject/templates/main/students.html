{% extends 'main/base.html' %}

{% block content %}

<div class="content">

    <h1>Students</h1>

    <table border="1" cellpadding="10">

        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Course</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.age }}</td>
            <td>{{ student.course }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}
